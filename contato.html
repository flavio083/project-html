<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Descubra Paraíba - Indicar Local</title>
</head>
<body>

    <header>
        <h1>Indique um Ponto Turístico</h1>
        <nav>
            <a href="index.html">Página Inicial</a> | 
            <a href="destinos.html">Destinos</a> | 
            <a href="contato.html">Sugerir Local</a>
        </nav>
    </header>

    <main>
        <!-- =========================================================
             PARTE 4: FORMULÁRIO DE SUGESTÕES
             Responsável: Integrante 4
             O que fazer: Criar o formulário completo de indicação utilizando
             as tags <form>, <label>, <input> (texto/email) e <button>.
             ========================================================= -->
        <section>
            <h2>Formulário de Indicação</h2>
            <!
<div>
    <p>
        Conhece algum lugar incrível na Paraíba que ainda não
        está em nosso site? Compartilhe sua sugestão conosco!
    </p>

    <form action="#" method="post">

        <div>
            <label for="nome">Nome completo:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >
        </div>

        <br>

        <div>
            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >
        </div>

        <br>

        <div>
            <label for="local">Nome do ponto turístico:</label>
            <input
                type="text"
                id="local"
                name="local"
                placeholder="Ex: Pedra da Boca"
                required
            >
        </div>

        <br>

        <div>
            <label for="cidade">Cidade:</label>
            <input
                type="text"
                id="cidade"
                name="cidade"
                placeholder="Ex: Araruna"
                required
            >
        </div>

        <br>

        <div>
            <label for="descricao">Descrição do local:</label>
            <textarea
                id="descricao"
                name="descricao"
                rows="5"
                cols="40"
                placeholder="Conte um pouco sobre esse lugar..."
                required
            ></textarea>
        </div>

        <br>

        <button type="submit">Enviar indicação</button>

    </form>
</div>
>
            
        </section>
    </main>

    <!-- =========================================================

</body>
</html>
